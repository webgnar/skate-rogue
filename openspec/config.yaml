schema: spec-driven

context: |
  Skate Rogue: a mobile-first 3D (2.5D side view) roguelike skate game in JavaScript/TypeScript with Three.js and Vite.
  docs/GDD.md is the game design document and the source of truth for design decisions; proposals must not
  contradict a decision marked "Decided" there without saying so.
  One-button controls only (tap / hold). Pure auto-run. No combat.
  Gameplay physics is 2D (x/y on the skate plane) with a fixed 60 Hz step, ported from Quest For Stoken (QFSHIVE);
  the z axis is visual only. Must hold 60 fps on a 2020 mid-range Android phone in a mobile browser.

